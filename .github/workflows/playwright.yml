name: Playwright Production Tests

# 1. Trigger the tests when code is pushed to main, or a PR is opened against main
on:
  push:
    branches: [ main, ChrmTests ]
  pull_request:
    branches: [ main, ChrmTests ]
  
#  schedule:
#    - cron: '30 18 * * 1-5' # Every weekday at 18:30 UTC (12: 00 AM IST)

permissions:
  contents: read 

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # 2. RUN TESTS WITH SECRETS INJECTED
    - name: Run Playwright Tests
      run: npm run test:prod:sharded
      env:
        # This maps the secure GitHub secrets to the OS environment variables!
        ENV: prod
        URL: ${{ secrets.URL }}
        EHR_USERNAME: ${{ secrets.EHR_USERNAME }}
        EHR_PASSWORD: ${{ secrets.EHR_PASSWORD }}
        EHR_CLINIC: ${{ secrets.EHR_CLINIC }}

    # 3. UPLOAD THE HTML REPORT
    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }} # Ensures the report uploads even if a test fails!
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    # 4. Google Chat Alert Hook
    - name: Send Google Chat Notification
      if: always()
      run: |
        curl -X POST -H "Content-Type: application/json" \
          -d '{
            "text": "*EHR Playwright Automation Run*\n\n*Status:* `${{ job.status }}`\n*Branch:* `${{ github.ref_name }}`\n\n <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Click here to view the run and download the HTML Report>"
          }' \
          "${{ secrets.GOOGLE_CHAT_WEBHOOK }}"